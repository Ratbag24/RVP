[alembic]
script_location = alembic
prepend_sys_path = .
# Quietens Alembic's deprecation warning about how it splits prepend_sys_path.
path_separator = os
# No sqlalchemy.url here on purpose. The URL comes from the environment via
# alembic/env.py, so there is no chance of a committed connection string being
# used against the wrong database.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
